<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HomeCare · 계정과 환자 연결</title><link rel="stylesheet" href="/base.css"><link rel="stylesheet" href="/auth.css"><script type="module" src="/auth-page.js"></script></head><body><main class="auth-card"><a class="auth-brand" href="/">HomeCare AI</a><h1>계정과 환자 연결</h1><p id="auth-loading" role="status">계정을 확인하고 있습니다…</p><p id="auth-error" class="auth-error" role="alert" hidden></p><section id="auth-content" hidden><p id="account-role"></p><details class="account-identifier"><summary>내 카카오 앱 사용자 ID 확인</summary><p>의료진 계정 등록이 필요하면 관리자가 이 ID를 서버의 의료진 목록에 등록합니다. 비밀번호나 토큰이 아닙니다.</p><code id="own-kakao-id"></code></details><section id="enrollment"><h2>의료진에게 받은 초대코드</h2><p>다른 환자의 기록과 섞이지 않도록 의료진이 준비한 코드로 본인 환자를 연결합니다.</p><form id="enrollment-form"><label for="invitation-code">환자 연결 초대코드</label><input id="invitation-code" required maxlength="100" autocomplete="off" spellcheck="false"><button id="enrollment-submit" type="submit">내 환자 기록 연결하기</button></form></section><a id="continue-link" class="auth-button" href="/patient" hidden>내 화면 열기</a><button id="account-logout" class="auth-secondary" type="button">HomeCare 로그아웃</button></section></main></body></html>
