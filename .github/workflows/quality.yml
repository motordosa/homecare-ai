name: Application and documentation checks
on:
  push:
    branches: [main, codex/free-demo-deploy]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run docs:check
      - run: npm test
      - run: bash integrations/android/checks/run-core-checks.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:automation
