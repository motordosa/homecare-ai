name: Application and documentation checks
on:
  push:
    branches: [main, codex/free-demo-deploy]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run docs:check
      - run: npm test
      - run: bash integrations/android/checks/run-core-checks.sh
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:automation
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use Android SDK provided by the GitHub runner
        run: |
          test -n "$ANDROID_HOME"
          test -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - run: gradle --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug :app:lintDebug

  ios:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test production Swift core
        run: swift test --package-path integrations/ios --jobs 2
      - name: Build iPhone simulator application without signing
        run: xcodebuild -project integrations/ios/HomeCareConnector.xcodeproj -scheme HomeCareConnector -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath /tmp/homecare-ios-build CODE_SIGNING_ALLOWED=NO build
