# Free demo only. No paid disk, database, or additional service is provisioned.
services:
  - type: web
    name: homecare-ai-demo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /tmp/homecare-data
      - key: VISION_ENABLED
        value: "true"
      - key: VISION_MODEL
        value: gpt-4.1-mini
      - key: HOMECARE_VISION_API_KEY
        sync: false
